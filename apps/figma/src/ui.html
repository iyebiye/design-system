<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: #000;
        background: #fff;
      }

      h1 {
        margin: 0 0 8px;

        font-size: 18px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;

        color: #666;

        font-size: 13px;
        line-height: 1.5;
      }

      button {
        width: 100%;

        padding: 10px 16px;

        border: 0;
        border-radius: 8px;

        background: #000;
        color: #fff;

        font: inherit;
        font-weight: 500;

        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <h1>Design System</h1>

    <p>
      Add components from the Design System to your Figma canvas.
    </p>

    <button id="create-button">
      Add Button
    </button>

    <script>
      document
        .getElementById("create-button")
        .addEventListener("click", () => {
          parent.postMessage(
            {
              pluginMessage: {
                type: "create-button"
              }
            },
            "*"
          );
        });
    </script>
  </body>
</html>
